name: Container integration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Infrastructure verifies P0 services; full requires real friend adapters
        type: choice
        options:
          - infrastructure
          - full
        default: infrastructure

permissions:
  contents: read

concurrency:
  group: full-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lifecycle:
    name: Verify selected container scope in runner Compose
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONPATH: src
      PIPELINE_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - run: python -m pip install --require-hashes -r requirements/dev.lock
      - name: Prepare runner-local environment
        run: |
          cp .env.example .env
          printf '\nAPP_UID=%s\n' "$(id -u)" >> .env
      - name: Run framework checks
        run: |
          ruff check .
          ruff format --check .
          python scripts/check_docs.py
          pytest
      - name: Run selected scope with container dependency preflight
        run: |
          if [ "$PIPELINE_MODE" = infrastructure ]; then
            bash scripts/run-all.sh --config configs/project.yaml --timeout-seconds 1800 --infrastructure-only
          else
            bash scripts/run-all.sh --config configs/project.yaml --timeout-seconds 7200
          fi
      - name: Import DAG in the actual Airflow image
        run: >-
          docker compose exec -T airflow-webserver python -c
          'from airflow.models import DagBag;
          bag = DagBag("/opt/airflow/dags", include_examples=False);
          assert not bag.import_errors, bag.import_errors;
          assert bag.get_dag("credit_default_pipeline") is not None'
      - name: Collect container logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose --profile application logs --no-color > artifacts/compose.log 2>&1 || true
      - name: Retain actual reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-${{ inputs.mode }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
      - name: Stop runner services
        if: always()
        run: docker compose --profile application down --remove-orphans
