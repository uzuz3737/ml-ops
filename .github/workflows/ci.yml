name: Framework CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: framework-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code_quality:
    name: Code and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - name: Install locked development tools
        run: python -m pip install --require-hashes -r requirements/dev.lock
      - name: Lint, format and check documentation
        run: |
          ruff check .
          ruff format --check .
          python scripts/check_docs.py
      - name: Run framework suite
        run: pytest

  data_contract:
    name: Data failure and provenance contracts (fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - run: python -m pip install --require-hashes -r requirements/dev.lock
      - name: Verify fail-closed runner and adapter preflight
        run: pytest tests/test_runner.py tests/test_worker.py tests/test_preflight.py tests/test_retraining.py

  model_gate:
    name: Candidate gate policy (fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - run: python -m pip install --require-hashes -r requirements/dev.lock
      - name: Verify passing, rejected and incomplete gate evidence
        run: pytest tests/test_gates.py
