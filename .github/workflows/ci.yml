name: Framework CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: framework-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: ruff check .
          - name: Formatting
            command: ruff format --check .
          - name: Documentation
            command: python scripts/check_docs.py && pytest tests/test_docs.py
          - name: Dependency compatibility
            command: python -m pip check
          - name: Orchestration and infrastructure
            command: pytest tests/test_runner.py tests/test_worker.py tests/test_preflight.py tests/test_retraining.py tests/test_airflow_launcher.py tests/test_dag_definition.py tests/test_compose.py tests/test_client.py
          - name: Deployment and rollback
            command: pytest tests/test_deployment.py
          - name: Candidate gate policy
            command: pytest tests/test_gates.py
          - name: Training and model bundles
            command: pytest tests/training
          - name: Model registry lifecycle
            command: pytest tests/registry
          - name: Delayed labels and quality monitoring
            command: pytest tests/monitoring/test_quality.py
          - name: P1 to P2 data contract
            command: pytest tests/test_p1_p2_contract.py
          - name: Serving API, watcher and benchmark
            extra: requirements/serving.lock
            command: pytest tests/serving tests/monitoring/test_exporters.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/mlops_project/training/requirements-dev.lock
      - name: Install locked development and model dependencies
        run: python -m pip install --require-hashes -r src/mlops_project/training/requirements-dev.lock
      - name: Install extra component lock
        if: matrix.extra
        run: python -m pip install --require-hashes -r ${{ matrix.extra }} && python -m pip check
      - name: Run check
        run: ${{ matrix.command }}
