name: P1 data and TFDV
on: [push, pull_request]
jobs:
  data:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --require-hashes -r requirements/p1-worker.lock
      - run: python -m pip install --require-hashes -r requirements/dev.lock
      - run: python -c "import tensorflow_data_validation; import mlops_project.data.pipeline"
        env:
          PYTHONPATH: src
      - run: python -m pytest tests/test_p1.py -q
        env:
          P1_UCI_INTEGRATION: '1'
  docker:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build actual P0 worker with P1 dependencies
        run: docker build --target integration --build-arg EXTRA_REQUIREMENTS=requirements/p1-worker.lock -t p1-worker:test .
      - name: Verify actual worker image and real data stages
        run: |
          mkdir -p artifacts
          chmod 777 artifacts
          docker run --rm --user 0 p1-worker:test python -m pip check
          docker run --rm --user 0 -e P1_UCI_INTEGRATION=1 -v "$PWD/artifacts:/workspace/artifacts" p1-worker:test sh -c 'python -m pip install --require-hashes -r requirements/dev.lock && python -m pytest tests/test_p1.py -q --basetemp artifacts/p1-tests'
      - name: Run actual P0 adapters as the image app user
        run: |
          for stage in ingest validate split features; do
            docker run --rm -v "$PWD/artifacts:/workspace/artifacts" p1-worker:test python -m mlops_project.pipelines.runner --step "$stage" --run-id p1-container-smoke --config configs/project.yaml
          done
      - name: Make container evidence readable for upload
        if: always()
        run: if [ -d artifacts ]; then sudo chmod -R a+rX artifacts; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-container-evidence
          path: artifacts
