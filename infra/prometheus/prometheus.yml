global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: credit-default-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]
# Model/data-drift gauges are exported by the owners' actual API/monitoring adapter.
# No synthetic model metrics are supplied by the P0 infrastructure.
