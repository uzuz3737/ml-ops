global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - alerts.yml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: credit-default-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]
# Drift and quality gauges come from the API's /metrics (monitoring/exporters.py).
