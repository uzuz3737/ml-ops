contract_version: 1
policy_version: credit-default-promotion-v1
status: initial-from-measured-baseline
gates:
  metric:
    name: average_precision
    direction: maximize
    positive_class: 1
    # Baseline AP 0.476 (component harness) / 0.515 (full DAG run); floor sits above prevalence ~0.221.
    minimum: 0.40
  comparison:
    # Absolute allowed AP loss against the comparison model on the same population.
    max_regression: 0.02
  service:
    # Provisional team targets; confirm workload/hardware before treating as SLOs.
    p95_latency_ms_max: 300.0
    throughput_rps_min: 20.0
    error_rate_max: 0.01
    batch_size: 1
    concurrency: 10
    measurement_seconds: 300
