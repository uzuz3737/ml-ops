contract_version: 1
project:
  name: credit-default-mlops
  target: default_next_month
  positive_class: 1
  seed: 42
  stakeholder_status: pending-validation
  topic_approval_status: pending-instructor-confirmation
dataset:
  uci_id: 350
  source: https://archive.ics.uci.edu/dataset/350
  identifier: ID
  license: CC-BY-4.0
  raw_dir: data/raw
  split_dir: data/splits
splits:
  strategy: stratified-client-disjoint
  train: 0.60
  validation: 0.20
  final_test: 0.10
  monitoring: 0.10
quality_gates: configs/quality_gates.yaml
schema_config: configs/data_schema.yaml
monitoring_config: configs/monitoring.yaml
serving:
  api_url: http://api:8000
  smoke_fixture: examples/predict.json
  deployments_dir: artifacts/deployments
  model_name: credit-default
pipeline:
  dag_id: credit_default_pipeline
  worker_url: http://pipeline-worker:8100
  stage_timeout_seconds: 1800
  deployment_timeout_seconds: 300
  deployment_poll_seconds: 1
  artifact_root: artifacts
  registry_finalize: mlops_project.registry.pipeline:finalize_deployment
  adapters:
    ingest: mlops_project.data.pipeline:ingest
    validate: mlops_project.data.pipeline:validate
    split: mlops_project.data.pipeline:split
    features: mlops_project.data.pipeline:features
    train_baseline: mlops_project.training.pipeline:train_baseline
    train_candidate_1: mlops_project.training.pipeline:train_candidate_1
    train_candidate_2: mlops_project.training.pipeline:train_candidate_2
    evaluate: mlops_project.training.pipeline:evaluate
    register: mlops_project.registry.pipeline:register
    benchmark: mlops_project.serving.pipeline:benchmark
    approve: mlops_project.pipelines.gates:approve
    deploy: mlops_project.pipelines.deployment:deploy
    verify: mlops_project.pipelines.deployment:verify
