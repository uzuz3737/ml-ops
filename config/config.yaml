project:
  name: "credit-card-default-mlops"
  version: "1.0.0"

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  validation_dir: "data/validation"
  raw_data_file: "data/raw/credit_card_clients.csv"
  train_data_file: "data/processed/train.parquet"
  test_data_file: "data/processed/test.parquet"
  val_data_file: "data/processed/val.parquet"
  stats_dir: "data/validation/stats"
  schema_dir: "data/validation/schema"
  anomalies_file: "data/validation/anomalies.txt"
  target_col: "default_payment_next_month"
  id_col: "ID"
  test_size: 0.2
  val_size: 0.1
  random_state: 42

features:
  categorical_cols:
    - "SEX"
    - "EDUCATION"
    - "MARRIAGE"
  numerical_cols:
    - "LIMIT_BAL"
    - "AGE"
    - "PAY_0"
    - "PAY_2"
    - "PAY_3"
    - "PAY_4"
    - "PAY_5"
    - "PAY_6"
    - "BILL_AMT1"
    - "BILL_AMT2"
    - "BILL_AMT3"
    - "BILL_AMT4"
    - "BILL_AMT5"
    - "BILL_AMT6"
    - "PAY_AMT1"
    - "PAY_AMT2"
    - "PAY_AMT3"
    - "PAY_AMT4"
    - "PAY_AMT5"
    - "PAY_AMT6"

model:
  selection_metric: "roc_auc"
  xgboost:
    objective: "binary:logistic"
    eval_metric: "auc"
    n_estimators: 150
    max_depth: 5
    learning_rate: 0.08
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: 3.5  # handle class imbalance (~22% default rate)
    random_state: 42
    n_jobs: 4
  logistic_regression:
    max_iter: 1000
    class_weight: "balanced"
    random_state: 42
  random_forest:
    n_estimators: 250
    max_depth: 12
    min_samples_leaf: 2
    class_weight: "balanced"
    random_state: 42
    n_jobs: 4
  lightgbm:
    n_estimators: 200
    learning_rate: 0.05
    num_leaves: 31
    class_weight: "balanced"
    random_state: 42
    n_jobs: 4

mlflow:
  tracking_uri: "http://localhost:5000"
  experiment_name: "credit_card_default_model_comparison"
  registered_model_name: "CreditCardDefaultBestModel"

serving:
  host: "0.0.0.0"
  port: 8000
  model_source: "models:/CreditCardDefaultBestModel/Production"
  fallback_model_path: "models/saved/best_model.joblib"
